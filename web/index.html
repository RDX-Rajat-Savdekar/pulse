<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div>
      <h1>Pulse</h1>
      <p>Events as they land.</p>
    </div>
    <p id="count">0 on the tape</p>
  </header>
  <main>
    <form id="send">
      <h2>Send</h2>
      <label>Type
        <input name="type" value="page.view" autocomplete="off" required>
      </label>
      <label>Source
        <input name="source" value="web" autocomplete="off" required>
      </label>
      <label>Id
        <input name="id" id="event-id" autocomplete="off" required>
      </label>
      <label>Payload
        <textarea name="payload" rows="4" required>{"path":"/"}</textarea>
      </label>
      <div class="actions">
        <button type="submit">Send event</button>
        <button type="button" id="repeat">Send same id</button>
      </div>
      <p id="status" role="status"></p>
    </form>
    <section class="tape" aria-live="polite">
      <h2>Tape</h2>
      <ol id="tape"></ol>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
